f you have an item 6 on your clearance.", "Never", "After permission is received from the RTC or Signalman."], "a": 3, "r": "CROR 104.2(a), p.41 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-10", "deck": "ctc", "n": 10, "q": "Your movement is operating in CTC and has been authorized to pass a block signal indicating Stop. You do not receive a 3(b) block clear or 3(c) block occupied on your authority form (no boxes are checked). At what speed must your movement proceed to the next signal or block end sign?", "o": ["Restricted speed.", "Medium speed.", "Prepared to stop within one-half the range of vision of equipment.", "Authorized track speed."], "a": 0, "r": "CROR 564(d), p.73; ROW 001 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-11", "deck": "ctc", "n": 11, "q": "You have completed switching over a dual control switch under the provisions of Signals suspended while switching in CTC. What information must be communicated to the RTC?", "o": ["The selector lever has been restored to \"power\" position and locked.", "If the switch has been lined for the main, or other than the main.", "How many times the switch has been thrown.", "Your name and occupation."], "a": 0, "r": "CROR 104.2(d), p.41 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-12", "deck": "ctc", "n": 12, "q": "A movement after having passed beyond the limits of a block needs to re-enter that block in CTC. After receiving permission from the RTC, what block signal indications can authorize such movement?", "o": ["Stop Signal.", "Any signal can authorize as the RTC knows our intentions.", "A Restricting signal with a plate displaying the letter \"R\".", "The permissive indication of a controlled signal or the indication of a non-controlled (intermediate) signal which is more favorable than Restricted speed."], "a": 3, "r": "CROR 573(a), p.76 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-13", "deck": "ctc", "n": 13, "q": "A movement has entered a controlled location in CTC on signal indication. It stops with its trailing end within the controlled location. How may it move in the opposite direction to enter another controlled block?", "o": ["There are no restrictions within the controlled location.", "Authority to work.", "At slow speed.", "At limited speed."], "a": 1, "r": "CBT answer (see also CROR 573(b), p.76) · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-14", "deck": "ctc", "n": 14, "q": "May the RTC provide your movement with a signal to enter a Foreman's limits in CTC prior to your movement's arrival at that signal?", "o": ["No, unless your movement has been authorized to work in the same limits.", "Yes. However no entry into Foreman's limits may be made until instructions from the Foreman are received verbally.", "No. The limits of a TOP must be protected by a stop signal in CTC at all times.", "Yes. However no entry into Foreman's limits may be made until instructions from the Foreman are received in writing."], "a": 3, "r": "CROR 567.2, p.74; 138, p.56 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-15", "deck": "ctc", "n": 15, "q": "After receiving an authority to work and verbal permission from the RTC, when may the crew consider signal indication suspended while switching at the dual control switch?", "o": ["After copying an authority to protect against another movement.", "With written permission only from the RTC", "When the dual control switch is placed in the \"hand\" position.", "Both (a) and (b)."], "a": 2, "r": "CROR 577.1(a), p.77 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-1", "deck": "abs", "n": 1, "q": "Are signals in ABS a movement's authority to occupy the main track?", "o": ["Yes", "Yes, if the signal is less restrictive than a Stop or Stop and Proceed signal.", "No. Block signals in ABS govern the use of blocks but do not authorize use of the main track.", "Only if RTC has provided verbal instructions to use the signals."], "a": 2, "r": "CROR 505, p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-2", "deck": "abs", "n": 2, "q": "A movement is stopped by a block signal indicating Stop in ABS. Who must communicate to the RTC?", "o": ["The locomotive engineer only.", "The RTC will contact your movement.", "A member of the crew.", "The conductor and locomotive engineer must both communicate to the RTC."], "a": 2, "r": "CROR 509(a), p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-3", "deck": "abs", "n": 3, "q": "With the exception of a movement re-entering a block occupied by a portion of their movement, what is required to pass a stop signal in ABS?", "o": ["Only a Clearance.", "Verbal instructions from RTC.", "Verbal permission from the RTC and must have a Stop and Proceed signal.", "Written Authorization from RTC"], "a": 3, "r": "CROR 509(a)(b), p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-4", "deck": "abs", "n": 4, "q": "When able to, what additional information will the RTC provide to the train crew in ABS when going past a stop signal?", "o": ["There is no track units in the block.", "No additional information is required.", "When able, the RTC will inform the crew member in writing: \"No conflicting movements.\"", "When able, the RTC will inform the crew member verbally: \"No conflicting movements\""], "a": 2, "r": "CROR 509(b), p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-5", "deck": "abs", "n": 5, "q": "Your movement has been delayed in the block in ABS after entering it on a Restricting Signal indication. How must you proceed if there are no track switches between your movement and the next signal?", "o": ["At Limited speed to the next signal.", "At Restricted speed to the next signal.", "At Slow speed to the next signal.", "At Diverging speed to the next signal."], "a": 1, "r": "Restricting indication: RESTRICTED speed to next signal (CROR 436; 515) · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-6", "deck": "abs", "n": 6, "q": "A movement has been delayed in the block in ABS after going by a Clear signal. How must it proceed if there is a track switch between the movement and the next signal?", "o": ["At track speed since you have a clearance to proceed.", "At Restricted speed.", "At Slow speed.", "At a speed that will permit stopping within half the range of vision of equipment"], "a": 3, "r": "CROR 515 (REDUCED speed), p.72 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-7", "deck": "abs", "n": 7, "q": "Your movement is authorized by a proceed clearance. You have passed beyond the limits of a block in ABS. While still within the limits of your proceed clearance, what authority do you require to back into this block?", "o": ["A work clearance.", "None, signal indication would be your authority.", "RTC permission.", "Permission to pass a stop signal from the RTC in writing"], "a": 0, "r": "CROR 80(a), p.32; 308.1, p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-8", "deck": "abs", "n": 8, "q": "A movement is stopped at a hand operated switch and will enter the main track in ABS. The RTC relieves the crew from the obligation to wait the 5 minutes. How is this relief given and when must a crew member open the switch?", "o": ["Verbally and the switch must be opened within 5 minutes of receiving the OK from the RTC.", "In writing and the switch may be lined at any time thereafter not exceeding 30 minutes.", "In writing and the switch must be opened within 5 minutes of receiving the OK from the RTC.", "In writing and the switch may be opened after waiting 5 minutes at the switch and no conflicting movement is seen."], "a": 2, "r": "CROR 513(a), p.72 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-9", "deck": "abs", "n": 9, "q": "A portion of your movement has been left on the main track to allow you to switch cars in a customer siding. You are now ready to return to your equipment. A Stop signal in ABS is encountered which protects the block where you left the portion of your movement. Written authorization is required to pass the Stop signal.", "o": ["TRUE", "FALSE"], "a": 1, "r": "CROR 509(a) Exception, p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-10", "deck": "abs", "n": 10, "q": "When going past a stop signal in ABS to return to your own movement, what must be done at the stop signal, if anything, and what speed applies?", "o": ["Need not stop at the signal and operate prepared to stop within half the range of vision of equipment.", "Must stop at the signal then proceed at slow speed.", "Must stop at the signal, receive authority to pass the signal and track speed applies.", "Need not stop at signal and track speed applies."], "a": 0, "r": "CROR 509(a) Exception (REDUCED speed), p.71 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-11", "deck": "abs", "n": 11, "q": "You are required to reverse your entire movement into a non-main track at a hand operated switch in ABS territory and have stopped with your tail end within 300 feet. What other condition must be met before reversing direction?", "o": ["RTC permission and observe the 5 minute waiting rule before reversing.", "There are no other requirements.", "Must not have released the track to be operated over and a crew member must be in a position to observe the track to be used.", "Both (a) and (c)."], "a": 2, "r": "CROR 308.1, p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "ABS-12", "deck": "abs", "n": 12, "q": "You have taken charge of a movement in ABS and are now ready to proceed. The movement entered the block on a Restricting signal indication; there is a main track entry switch between you and the next signal. What speed must be observed to the next signal?", "o": ["Track speed.", "Slow speed.", "Restricted speed.", "Must get the signal indication from the RTC."], "a": 2, "r": "CROR 147(c), p.57; Restricting indication · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-1", "deck": "int", "n": 1, "q": "What governs the use of routes within interlocking limits?", "o": ["A Clearance.", "GBO/TGBO.", "Signal Indication.", "Both A and B."], "a": 2, "r": "CROR 601, p.78 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-2", "deck": "int", "n": 2, "q": "A movement is approaching an automatic interlocking equipped with a timing circuit. When must the movement approaching the interlocking signal be prepared to stop?", "o": ["When the movement has occupied the track in excess of 5 minutes.", "When the timing circuit has been occupied in excess of 5 minutes.", "When the timing circuit has been occupied in excess of the time specified in special instructions.", "When the track between the advance signal and interlocking signal is occupied in excess of 5 minutes."], "a": 2, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-3", "deck": "int", "n": 3, "q": "A movement is stopped by a Stop signal at an automatic interlocking. What must a crew member do?", "o": ["A crew member, after opening the box marked \"switches\", will observe the panel lights, where provided.", "A crew member must, after opening the knife switch, wait 5 minutes.", "A crew member will contact the RTC before opening the knife switch to ascertain whether or not a movement is closely approaching.", "A crew member will contact the RTC before opening the box marked switches."], "a": 0, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-4", "deck": "int", "n": 4, "q": "At the automatic interlocking, the lights of the conflicting route are lighted and no conflicting movement is evident. What must you do?", "o": ["Make a call to the RTC.", "Open the switch, wait 5 minutes, then proceed.", "Open the switch and allow your train or engine to proceed.", "Wait 5 minutes, open the switch and proceed."], "a": 2, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-5", "deck": "int", "n": 5, "q": "In situations where lights are not provided at an interlocking or lights of the conflicting route(s) are not lighted, what must be done after opening the switch?", "o": ["Proceed immediately.", "Proceed at Restricted speed.", "Call the RTC.", "Wait five minutes and allow train to proceed, unless a greater period is specified by special instructions."], "a": 3, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-6", "deck": "int", "n": 6, "q": "A movement is stopped by a Stop signal at a remotely-controlled interlocking. What must a crew member do?", "o": ["A movement must have authority from the signalman to pass a signal indicating stop. Such authority must be in writing.", "A crew member must wait until a more favorable signal than Stop is displayed.", "A crew member must be ready to copy a clearance from the RTC.", "Make a broadcast and proceed."], "a": 0, "r": "CROR 601–602 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-7", "deck": "int", "n": 7, "q": "A movement is stopped by a Stop Signal at a locally-controlled interlocking. What must a crew member do?", "o": ["A crew member must communicate with the signalman in charge of this interlocking.", "A crew member must wait until a more favorable signal than Stop is displayed.", "A crew member must be ready to copy a clearance from the RTC.", "Make a broadcast and proceed."], "a": 0, "r": "CROR 601 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-8", "deck": "int", "n": 8, "q": "A movement is stopped by a Stop signal at a locally-controlled interlocking. The signalman is off duty. How will the movement be governed?", "o": ["The movement will be governed by General Bulletin Order.", "The movement will be governed by special instructions.", "The movement will be governed by Daily Operating Bulletin.", "None of the above."], "a": 1, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-9", "deck": "int", "n": 9, "q": "A movement is stopped by a Stop signal at a locally-controlled interlocking. The signalman is off duty. How do you know who is the signalman in charge?", "o": ["By the GOI.", "By general order.", "By instructions from the RTC", "By special instruction."], "a": 3, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "INT-10", "deck": "int", "n": 10, "q": "A movement is operating through the limits of a manual interlocking. How will it be governed?", "o": ["By the GOI.", "By general order.", "By special instructions.", "By instructions from the RTC"], "a": 2, "r": "CPKC Knowledge Check (CBT) answer key", "f": 0}]};
const $=s=>document.querySelector(s);
const LET="abcde";
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let hist=store.get("ced-hist",{});
let st=Object.assign({deck:"all",order:"seq",filter:"none"},store.get("ced-prefs",{}));
const TITLES={all:"All Questions",p2:"CNDR PT II Exam Review",sg:"Study Guide Quiz – T&E Canada",ocs:"CNDR PT II OCS Knowledge Check",ctc:"CNDR PT II CTC Knowledge Check",abs:"CNDR PT II ABS Knowledge Check",int:"CNDR PT II INT Knowledge Check",p1:"CNDR PT I Review (open)"};
const SHORT={p2:"Part 2 Review",sg:"Study Guide",ocs:"OCS",ctc:"CTC",abs:"ABS",int:"Interlocking",p1:"Part 1"};
const DECKS=["all","p2","sg","ocs","ctc","abs","int"];
if(!DECKS.includes(st.deck))st.deck="all";
let queue=[],i=0,ans=[],sel=null,showResults=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const count=d=>BANK.questions.filter(q=>d==="all"||q.deck===d).length;
function pool(){
  let qs=BANK.questions.filter(q=>st.deck==="all"||q.deck===st.deck);
  if(st.filter==="miss")qs=qs.filter(q=>hist[q.id]&&hist[q.id].ok===false);
  if(st.filter==="flag")qs=qs.filter(q=>q.f);
  qs=qs.slice();
  if(st.order==="shuf")for(let k=qs.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[qs[k],qs[j]]=[qs[j],qs[k]]}
  return qs;
}
function start(list){queue=list||pool();i=0;ans=[];sel=null;showResults=false;store.set("ced-prefs",st);$("#ttl").textContent=TITLES[st.deck];render()}
function record(q,ok){const h=hist[q.id]||{c:0,w:0};h.ok=ok;ok?h.c++:h.w++;hist[q.id]=h;store.set("ced-hist",hist)}
const chev='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="7"/><path d="M5 7l3 3 3-3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function render(){
  const m=$("#main");$("#pbar").style.width=queue.length?((showResults?queue.length:i)/queue.length*100)+"%":"0";
  if(!queue.length){m.innerHTML=`<p class="qhead">Nenhuma questão</p><p class="hint">${st.filter==="miss"?"Você ainda não errou nenhuma questão desta lista.":"Abra o menu e escolha outra lista ou modo."}</p>`;$("#nav").innerHTML=`<span class="spacer"></span><button class="primary" id="openmenu">Escolher lista</button>`;return}
  if(showResults)return results();
  const q=queue[i],a=ans[i];
  const meta=`<div class="qmeta"><span>${i+1} of ${queue.length} · ${SHORT[q.deck]} Q${q.n}</span>${q.f?'<span class="flag">⚠ confirmar com o instrutor</span>':""}</div>`;
  let body="";
  if(q.o){
    const locked=a!==undefined, pick=locked?a.pick:sel;
    body=`<fieldset class="opts ${locked?"locked":""}"><legend hidden>Options</legend>${q.o.map((o,k)=>{
      let mk="";if(locked){if(k===q.a)mk='<span class="mark ok">✓</span>';else if(k===pick)mk='<span class="mark bad">✕</span>'}
      return `<label class="opt">${mk}<input type="radio" name="o" value="${k}" ${pick===k?"checked":""} ${locked?"disabled":""}><span>${q.o.length>2&&/^[a-d]\./i.test(o)?"":""}${esc(o)}</span></label>`}).join("")}</fieldset>`;
    if(locked)body+=`<div class="fb ${a.ok?"":"bad"}">${a.ok?"Correct":"Incorrect"}${a.ok?"":`<div class="ans">Correct answer: ${LET[q.a]}. ${esc(q.o[q.a])}</div>`}<div class="ref">${esc(q.r)}</div>${q.f?'<div class="note">⚠ Interpretação: a regra não diz isso literalmente.</div>':""}</div>`;
  }else{
    body=`<p class="hint">Responda de cabeça e depois confira.</p>`;
    if(a&&a.shown)body+=`<div class="open-ans"><b>Answer</b><div>${esc(q.ans)}</div><div class="fb ${a.ok===false?"bad":""}" style="margin-top:10px"><div class="ref" style="margin:0">${esc(q.r)}</div></div></div>`;
  }
  m.innerHTML=`<p class="qhead">Question ${i+1} ${chev}</p>${meta}<p class="qtext">${esc(q.q)}</p>${body}`;
  navbar();
}
function navbar(){
  const q=queue[i],a=ans[i],last=i===queue.length-1;
  const prev=`<button class="link" id="prev" ${i===0?"disabled":""}>Previous</button><span class="spacer"></span>`;
  let mid,next;
  if(q.o){
    mid=`<button class="link" id="check" ${a!==undefined||sel===null?"disabled":""}>Check Answer</button>`;
    next=`<button class="primary" id="next">${last?"View Results":"Next"}</button>`;
  }else if(!a||!a.shown){
    mid="";next=`<button class="primary" id="show">Show Answer</button>`;
  }else if(a.ok===undefined){
    mid=`<button class="link" id="selfbad" style="color:var(--bad)">Errei</button>`;next=`<button class="primary" id="selfok">Acertei</button>`;
  }else{mid="";next=`<button class="primary" id="next">${last?"View Results":"Next"}</button>`}
  $("#nav").innerHTML=prev+mid+next;
}
function check(){const q=queue[i];if(sel===null||ans[i])return;const ok=sel===q.a;ans[i]={pick:sel,ok};record(q,ok);render()}
function go(d){i+=d;sel=null;if(i>=queue.length){i=queue.length-1;showResults=true}render();window.scrollTo(0,0)}
function results(){
  const done=ans.filter(x=>x&&x.ok!==undefined),ok=done.filter(x=>x.ok).length,t=done.length,pct=t?Math.round(ok/t*100):0;
  const miss=queue.filter((q,k)=>ans[k]&&ans[k].ok===false);
  $("#main").innerHTML=`<div class="result"><h2>Results</h2><div class="big ${pct>=85?"pass":"fail"}">${pct}%</div><p>${ok} de ${t} corretas${t<queue.length?` · ${queue.length-t} não respondidas`:""}. ${pct>=85?"Nível de aprovação.":"Revise as erradas e tente de novo."}</p>${miss.length?`<ul class="miss">${miss.map(q=>`<li><span class="ref">${SHORT[q.deck]} Q${q.n}</span><br>${esc(q.q)}<br><b>${q.o?LET[q.a]+". "+esc(q.o[q.a]):esc(q.ans)}</b></li>`).join("")}</ul>`:""}</div>`;
  $("#nav").innerHTML=`${miss.length?'<button class="link" id="redo">Refazer erradas</button>':""}<span class="spacer"></span><button class="primary" id="again">Recomeçar</button>`;
  window._miss=miss;
}
function menu(){
  const seen=Object.keys(hist).length,wrong=Object.values(hist).filter(h=>h.ok===false).length;
  $("#sheet").innerHTML=`<div class="panel" role="dialog" aria-label="Lista e modo"><div class="panel-in">
   <h2>Conductor Exam Drill</h2><div class="stats">${BANK.questions.length} questões · ${seen} já respondidas · ${wrong} para revisar</div>
   <div class="grp"><div class="grp-t">Lista</div>${DECKS.map(d=>`<label class="row"><input type="radio" name="deck" value="${d}" ${st.deck===d?"checked":""}>${d==="all"?"Todas as questões":TITLES[d]}<span class="n">${count(d)}</span></label>`).join("")}</div>
   <div class="grp"><div class="grp-t">Ordem</div>
     <label class="row"><input type="radio" name="order" value="seq" ${st.order==="seq"?"checked":""}>Em ordem</label>
     <label class="row"><input type="radio" name="order" value="shuf" ${st.order==="shuf"?"checked":""}>Embaralhar</label></div>
   <div class="grp"><div class="grp-t">Filtro</div>
     <label class="row"><input type="radio" name="filter" value="none" ${st.filter==="none"?"checked":""}>Todas</label>
     <label class="row"><input type="radio" name="filter" value="miss" ${st.filter==="miss"?"checked":""}>Só as que errei</label>
     <label class="row"><input type="radio" name="filter" value="flag" ${st.filter==="flag"?"checked":""}>Só as marcadas ⚠</label></div>
   <button class="primary" id="apply">Começar</button>
   <button class="danger" id="reset">Zerar histórico</button>
  </div></div>`;
  $("#sheet").hidden=false;
}
document.addEventListener("change",e=>{if(e.target.name==="o"){sel=+e.target.value;navbar()}});
document.addEventListener("click",e=>{
  if(e.target.id==="sheet"){$("#sheet").hidden=true;return}
  const t=e.target.closest("button");if(!t)return;
  switch(t.id){
    case "menu":case "openmenu":menu();break;
    case "apply":{const f=n=>($(`#sheet input[name=${n}]:checked`)||{}).value;st.deck=f("deck")||st.deck;st.order=f("order")||st.order;st.filter=f("filter")||st.filter;$("#sheet").hidden=true;start();window.scrollTo(0,0);break}
    case "reset":if(t.dataset.arm){hist={};store.set("ced-hist",hist);$("#sheet").hidden=true;start()}else{t.dataset.arm=1;t.textContent="Toque de novo para confirmar"}break;
    case "check":check();break;
    case "next":go(1);break;
    case "prev":go(-1);break;
    case "show":ans[i]={shown:true};render();break;
    case "selfok":ans[i].ok=true;record(queue[i],true);go(1);break;
    case "selfbad":ans[i].ok=false;record(queue[i],false);go(1);break;
    case "again":start();break;
    case "redo":start(window._miss.slice());break;
  }
});
document.addEventListener("keydown",e=>{
  if(!$("#sheet").hidden){if(e.key==="Escape")$("#sheet").hidden=true;return}
  const q=queue[i];if(!q||showResults)return;
  if(q.o&&!ans[i]&&/^[1-5]$/.test(e.key)&&+e.key<=q.o.length){sel=+e.key-1;render()}
  else if(e.key==="Enter"){e.preventDefault();if(q.o&&!ans[i]&&sel!==null)check();else if(ans[i]&&(q.o||ans[i].ok!==undefined))go(1)}
});
start();
</script>

</body>
