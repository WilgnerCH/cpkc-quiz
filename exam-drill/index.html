<html lang="en">
<head>
<meta charset="utf-8">

<title>Conductor Exam Drill</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#c8102e">
<style>
/* Layout: mobile course-player look — red title bar, light grey canvas, "Question N" with radio options, check/next bar pinned to the bottom. Single light look on purpose (matches the CBT player). */
:root{
  --bar:#c8102e; --bar-ink:#ffffff; --bg:#f4f5f7; --ink:#1d2127; --muted:#5f6670; --line:#c9ced6;
  --blue:#0a6ed1; --blue-soft:#7fb0e2; --ok:#2b7d2b; --ok-bg:#f5faeb; --ok-line:#d6e8b4;
  --bad:#d0021b; --bad-bg:#fdecef; --bad-line:#f1b8c2; --warn:#8a5a00; --warn-bg:#fff4dc;
  --font:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --gutL:max(16px,env(safe-area-inset-left,0px)); --gutR:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);color:var(--bar-ink);padding-block:12px;padding-left:var(--gutL);padding-right:var(--gutR);display:flex;align-items:center;gap:12px}
.top h1{flex:1;min-width:0;margin:0;font-size:1.1rem;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{flex:none;background:none;border:1px solid rgba(255,255,255,.55);color:var(--bar-ink);border-radius:4px;width:36px;height:32px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.progress{height:4px;background:#e2e5ea}
.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}
main{max-width:680px;margin:0 auto;padding-left:var(--gutL);padding-right:var(--gutR);padding-block:22px calc(92px + env(safe-area-inset-bottom,0px))}
.qhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;margin:0 0 10px}
.qhead svg{width:16px;height:16px;color:var(--blue)}
.qmeta{font-size:.75rem;color:var(--muted);margin:-4px 0 12px;display:flex;gap:8px;flex-wrap:wrap}
.flag{color:var(--warn);background:var(--warn-bg);border-radius:3px;padding:0 6px}
.qtext{margin:0 0 18px;font-size:1.08rem;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;border:0}
.opt{position:relative;display:flex;align-items:flex-start;gap:12px;padding:13px 8px 13px 28px;cursor:pointer;font-size:1.02rem;min-height:52px;border-radius:6px}
.opt:active{background:#e9ecf0}
.opt input{appearance:none;-webkit-appearance:none;flex:none;margin:1px 0 0;width:24px;height:24px;border:2px solid #8b939e;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer}
.opt input:checked{border-color:var(--blue)}
.opt input:checked::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue-soft)}
.opt input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .mark{position:absolute;left:4px;top:15px;font-weight:700;font-size:1rem;line-height:20px}
.opt .mark.ok{color:var(--ok)} .opt .mark.bad{color:var(--bad)}
.locked .opt{cursor:default}
.fb{margin-top:20px;border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:4px;padding:12px 14px;font-size:1rem}
.fb.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.fb .ans{margin-top:6px}
.fb .ref{margin-top:6px;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.fb .note{margin-top:6px;font-size:.8rem;color:var(--warn)}
.open-ans{margin-top:20px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:12px 14px;font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid #e1e4e9;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:var(--gutL);padding-right:var(--gutR)}
.nav-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.link{background:none;border:0;font:inherit;font-size:1rem;color:var(--blue);cursor:pointer;padding:10px 4px}
.link[disabled]{color:var(--blue-soft);cursor:default}
.spacer{flex:1}
.primary{font:inherit;font-size:.95rem;background:var(--blue);color:#fff;border:2px solid var(--blue);border-radius:6px;padding:10px 22px;min-height:48px;cursor:pointer}
.primary[disabled]{background:var(--blue-soft);border-color:var(--blue-soft);cursor:default}
.link:focus-visible,.primary:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.result h2{font-size:1.2rem;margin:0 0 6px}
.big{font-size:3rem;font-weight:700;line-height:1;margin:8px 0;font-variant-numeric:tabular-nums}
.big.pass{color:var(--ok)} .big.fail{color:var(--bad)}
.miss{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
.miss li{border-top:1px solid #e1e4e9;padding:10px 0;font-size:.9rem}
.miss .ref{color:var(--muted);font-size:.75rem}
.miss b{color:var(--ok);font-weight:600}
/* menu sheet */
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(20,24,30,.45);display:flex;align-items:flex-end}
.panel{width:100%;max-height:85vh;overflow:auto;background:#fff;border-radius:12px 12px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:var(--gutL);padding-right:var(--gutR)}
.panel-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:1.05rem}
.grp{display:flex;flex-direction:column;gap:2px}
.grp-t{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #eef0f3;cursor:pointer;font-size:.95rem}
.row span.n{margin-left:auto;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.row input{accent-color:var(--blue);width:18px;height:18px;margin:0}
.stats{font-size:.82rem;color:var(--muted)}
.panel .primary{width:100%}
.danger{background:none;border:0;color:var(--bad);font:inherit;font-size:.85rem;text-decoration:underline;padding:6px 0;cursor:pointer;align-self:flex-start}
.foot{margin-top:28px;font-size:.75rem;color:var(--muted)}
</style>

<script>
const BANK ={"version": "2026-10-28b", "decks": {"p2": "Part 2 Exam Review", "sg": "Study Guide Quiz", "ocs": "OCS Knowledge Check", "ctc": "CTC Knowledge Check", "abs": "ABS Knowledge Check", "int": "Interlocking Knowledge Check"}, "questions": [{"id": "P2-2", "deck": "p2", "n": 2, "q": "What is the minimum distance that you must keep from the end of standing equipment if not protected?", "o": ["At least 15 feet or 5 meters", "At least 3 car lengths or 150 feet", "At least 1 car length or 50 feet", "At least 30 feet or 10 meters"], "a": 0, "r": "T&E Safety Rule Book T-20 item 5, p.17", "f": 0}, {"id": "P2-3", "deck": "p2", "n": 3, "q": "Before we begin work each day, everyone within the group working together must understand what is to be accomplished.", "o": ["True", "False"], "a": 0, "r": "T&E Safety Rule Book T-0 Job Briefing, p.8", "f": 0}, {"id": "P2-4", "deck": "p2", "n": 4, "q": "Verbal communication must take place between crew members. As per communication requirements, when derails are required to be handled or locked.", "o": ["True", "False"], "a": 0, "r": "CROR General Rule C(i), p.14", "f": 0}, {"id": "P2-5", "deck": "p2", "n": 5, "q": "Except for riding the end platform of a tank car, may you ride on the leading end platform or cross over between two coupled cars when moving?", "o": ["Yes", "No"], "a": 1, "r": "CROR General Rule C(vi), p.14; Safety Rule Book T-24 items 4 and 7, p.21", "f": 0}, {"id": "P2-6", "deck": "p2", "n": 6, "q": "May you ride inside an empty gondola?", "o": ["Yes, if instructed to do so by the Locomotive Engineer", "Yes, only if it's empty", "Yes, only if the lading will not shift", "No"], "a": 3, "r": "Safety Rule Book T-24 item 7 (\"inside a gondola\"), p.21", "f": 0}, {"id": "P2-7", "deck": "p2", "n": 7, "q": "Provide 3-point protection when cars are connected to locomotive and when...", "o": ["Working on the ground with one or both feet between the rails, between equipment or within 15 feet of the end of equipment", "Working on the ground and breaking the plane of the rail with your torso between equipment or within 15 feet of the end of equipment", "Crossing over standing equipment", "A & B"], "a": 3, "r": "Safety Rule Book T-27, p.23", "f": 0}, {"id": "P2-8", "deck": "p2", "n": 8, "q": "You are riding in a locomotive with the windows open. What PPE is mandatory?", "o": ["High visibility vest, safety glasses, safety boots", "High visibility vest, safety glasses, safety boots, gloves", "High visibility vest, safety glasses, safety boots, gloves, hearing protection", "Safety glasses, safety boots, hearing protection"], "a": 3, "r": "Safety Rule Book T-22 chart, \"In locomotives – open windows\", p.20", "f": 0}, {"id": "P2-9", "deck": "p2", "n": 9, "q": "You are switching with locomotives attached. May you apply or release a hand brake from the leading platform of a car while the car is moving?", "o": ["Yes", "No"], "a": 1, "r": "Safety Rule Book T-24 item 7 (lead platform only for cars rolling under their own momentum), p.21", "f": 0}, {"id": "P2-10", "deck": "p2", "n": 10, "q": "What is the minimum distance between two cars before going in between to align a drawbar?", "o": ["At least 15 feet or 5 meters", "At least 3 car lengths or 150 feet", "At least 1 car length or 50 feet", "At least 30 feet or 10 meters"], "a": 2, "r": "Safety Rule Book T-5 item 1, p.11", "f": 0}, {"id": "P2-11", "deck": "p2", "n": 11, "q": "You are riding on the outside of the locomotive. What PPE is mandatory?", "o": ["High visibility vest, safety glasses, safety boots", "High visibility vest, safety glasses, safety boots, gloves", "High visibility vest, safety glasses, safety boots, gloves, hearing protection", "Safety glasses, safety boots, hearing protection"], "a": 2, "r": "Safety Rule Book T-22 chart, \"Riding on locomotives outside of cab\", p.20", "f": 0}, {"id": "P2-12", "deck": "p2", "n": 12, "q": "How would you test the effectiveness of hand brakes?", "o": ["Release all air brakes and allow or cause the slack to adjust, or apply sufficient tractive effort to apply force on the equipment", "Release locomotive air brakes and attempt to move the secured cut of cars", "It must be apparent when the slack runs in or out, or when force is applied, that the hand brakes are sufficient to prevent that equipment from moving", "Both (a) and (c)"], "a": 3, "r": "CROR 112(vi), p.44", "f": 0}, {"id": "P2-13", "deck": "p2", "n": 13, "q": "Verbal communication must take place between crew members. As per communication requirements, when shoving equipment.", "o": ["True", "False"], "a": 0, "r": "CROR General Rule C(i), p.14", "f": 0}, {"id": "P2-14", "deck": "p2", "n": 14, "q": "What will happen to the air brakes on the movement if there is an increase of pressure in the brake pipe?", "o": ["Release", "Apply"], "a": 0, "r": "Air brake principle", "f": 0}, {"id": "P2-15", "deck": "p2", "n": 15, "q": "What will happen to the air brakes on the movement if there is a reduction in the brake pipe pressure?", "o": ["Release", "Apply"], "a": 1, "r": "Air brake principle", "f": 0}, {"id": "P2-16", "deck": "p2", "n": 16, "q": "You are working on the ground in a yard. What PPE is mandatory?", "o": ["High visibility vest, safety glasses, safety boots", "High visibility vest, safety glasses, safety boots, gloves", "High visibility vest, safety glasses, safety boots, gloves, hearing protection", "High visibility vest, safety glasses, safety boots, hearing protection"], "a": 1, "r": "Safety Rule Book T-21 (gloves when operating switches, derails, cars), p.19; T-22 \"Handling switches\", p.20", "f": 1}, {"id": "P2-17", "deck": "p2", "n": 17, "q": "What is required before performing a No. 1A brake test?", "o": ["Properly position all cocks and valves", "Couple brake pipe hoses", "Release all hand brakes unless required because of grade", "Ensure the rear car is charged to within 15 psi of the locomotive pressure", "All of the above"], "a": 4, "r": "GOI Section 3 item 6.2, p.8", "f": 0}, {"id": "P2-18", "deck": "p2", "n": 18, "q": "Verbal communication must take place between crew members. As per communication requirements, when restrictions are no longer applicable.", "o": ["True", "False"], "a": 0, "r": "CROR General Rule C(i), p.14", "f": 0}, {"id": "P2-19", "deck": "p2", "n": 19, "q": "You arrive at your crew change location and did not take control of the movement from the inbound crew (and you have a valid CIF). What type of brake test would normally be performed before departing?", "o": ["No. 1 brake test", "No. 1A brake test", "Continuity brake test", "All of the above"], "a": 2, "r": "GOI Section 3 items 10.1 and 10.4 (exemption only for a direct handoff), p.10", "f": 0}, {"id": "P2-20", "deck": "p2", "n": 20, "q": "Before entraining or detraining, to whom must you communicate your intention?", "o": ["Locomotive Engineer", "Remote control operator", "No communication needed", "Either (a) or (b)"], "a": 3, "r": "Safety Rule Book T-11 item 2 (includes RCLS/RCO), p.13", "f": 0}, {"id": "P2-21", "deck": "p2", "n": 21, "q": "When performing the No. 1A brake test...", "o": ["Ensure air brakes set up and release on all cars being tested", "Ensure integrity & continuity of the brake pipe", "Ensure 85% of brakes are operative", "All of the above"], "a": 3, "r": "GOI Section 3 items 6.1 (85%), p.7, and 8.1, p.9", "f": 0}, {"id": "P2-22", "deck": "p2", "n": 22, "q": "You are setting off 90 cars into non-main track. Unless otherwise specified by special instructions, how would we leave these cars unattended?", "o": ["Apply a sufficient amount of hand brakes through proper testing", "Apply 11 hand brakes, no testing is required", "Only 8 hand brakes are required", "Apply hand brakes on 10% of the total number of cars"], "a": 0, "r": "CROR 112(b), p.45; GOI Section 4 item 6.2 (System Revision Doc p.24)", "f": 0}, {"id": "P2-23", "deck": "p2", "n": 23, "q": "After a switch has been turned, what must be done to ensure it is properly lined?", "o": ["The points must be examined and the target, reflector or light observed", "Report the new position to the RTC or ATM", "Secure the switch with a lock", "Communicate, with another rules qualified employee, the position in which the switch has been left"], "a": 0, "r": "CROR 104(b), p.38", "f": 0}, {"id": "P2-24", "deck": "p2", "n": 24, "q": "What type of brake test would you as Conductor physically participate in?", "o": ["No. 1 brake test", "No. 1A brake test", "Continuity brake test", "Brake pipe leakage test"], "a": 1, "r": "GOI Section 3 items 6.1 and 8.1 (No. 1A by qualified persons; No. 1 by certified car inspector), p.7 and p.9", "f": 0}, {"id": "P2-25", "deck": "p2", "n": 25, "q": "When would it be necessary to cut out the air brakes on a car?", "o": ["Hand brake is not fully released", "Defective control valve", "Retaining valve is not in the direct exhaust position", "Missing end cap bolt"], "a": 1, "r": "GOI Section 5 items 14.0(b) and 13.2(h), p.7", "f": 0}, {"id": "P2-26", "deck": "p2", "n": 26, "q": "You are a yard service employee in a switching operation on non-main track. Your movement is required to move 50 car lengths into a track. You can see the track is clear of equipment, but cannot readily see the position of any switches on such track. In order to make this move, what must the track be known to be clear of?", "o": ["Track units", "Blue flag or blue light / Red flag or red light", "All switches are properly lined and derails removed if applicable", "All of the above"], "a": 3, "r": "CROR 115(b), p.50", "f": 0}, {"id": "P2-27", "deck": "p2", "n": 27, "q": "Your movement is operating on a yard track. In addition to being prepared to stop within one-half the range of vision of equipment, what must your movement also be prepared to do?", "o": ["Stop short of a switch not properly lined", "Stop within one-half the range of vision of a track unit", "Stop short of the red flag or red light between the rails", "All of the above"], "a": 3, "r": "CROR 105 and 105(c), p.42", "f": 0}, {"id": "P2-28", "deck": "p2", "n": 28, "q": "Verbal communication must take place between crew members. As per communication requirements, immediately after passing a wayside (hot box) detector, confirming the message.", "o": ["True", "False"], "a": 0, "r": "CROR General Rule C(i), p.14", "f": 0}, {"id": "P2-29", "deck": "p2", "n": 29, "q": "You take charge of a movement where a personal transfer with the inbound crew is not possible. You notice that the brake test portion of the Crew Information Form / Train Brake Status is incomplete. What type of brake test would you have to perform?", "o": ["No. 1 brake test", "No. 1A brake test", "Continuity brake test", "All of the above"], "a": 1, "r": "GOI Section 3 item 17.3 (\"No 1 or No 1A\"; crews can only perform the 1A), p.15", "f": 1}, {"id": "P2-30", "deck": "p2", "n": 30, "q": "Cars that contain lading which has a tendency to shift, if not fully protected by bulkhead or a bulkhead type car, must not be placed next to what types of equipment?", "o": ["Occupied service equipment cars", "Locomotive", "Passenger cars", "All of the above"], "a": 3, "r": "GOI Section 7 item 16.2 B, p.22", "f": 0}, {"id": "P2-31", "deck": "p2", "n": 31, "q": "What type of load requires a protection notice?", "o": ["Dimensional shipment", "A dangerous goods car", "Service equipment cars", "Multi-level automobile cars"], "a": 0, "r": "GOI Section 10 item 2.2, p.2", "f": 0}, {"id": "P2-32", "deck": "p2", "n": 32, "q": "Unless a lower speed is specified, what is the maximum speed for a Key Train?", "o": ["35 MPH", "40 MPH", "55 MPH", "50 MPH"], "a": 3, "r": "GOI Section 8 item 11.3 (50 MPH outside CMA; 35 MPH within CMA), p.16", "f": 0}, {"id": "P2-33", "deck": "p2", "n": 33, "q": "When would a No. 1A brake test NOT be performed?", "o": ["Where a train is made up at other than a safety inspection location", "When cars which have not been previously tested are added to a train", "Where a train is made up at a safety inspection location", "When brake test status is not available"], "a": 2, "r": "GOI Section 3 items 7.1 and 8.1, p.8–9", "f": 0}, {"id": "P2-34", "deck": "p2", "n": 34, "q": "Loaded multi-level automobile cars must not be placed immediately behind what types of cars?", "o": ["Loads prone to shifting", "Open top cars containing coal, sand, gravel, sulphur, or similar commodities", "Service equipment cars", "Multi-platform car"], "a": 1, "r": "GOI Section 7 item 16.1 A, p.20", "f": 0}, {"id": "P2-35", "deck": "p2", "n": 35, "q": "If you cut out the air brakes on a car, what two forms must this be recorded on?", "o": ["Crew information form / train brake status", "1225 form", "125 form", "Both A and B"], "a": 3, "r": "GOI Section 3 item 16.1 (System Revision Doc p.21)", "f": 0}, {"id": "P2-36", "deck": "p2", "n": 36, "q": "If lifting a dimensional load en route, what must you do before proceeding?", "o": ["Notify RTC", "Verify protection notice", "Nothing is required", "Both A and B"], "a": 3, "r": "GOI Section 10 items 5.1, p.9, and 2.3, p.4", "f": 0}, {"id": "P2-37", "deck": "p2", "n": 37, "q": "You are required to push 20 cars into a non-signalled yard track. How do you know that the track you will be pushing into is clear?", "o": ["It must be seen to be clear and will remain clear", "The ATM can advise that it is clear", "By checking the track inventory", "By communicating with the last crew known to have used the track"], "a": 0, "r": "CROR 115(b), p.50 (CPKC prohibits relying on \"known to be clear\"; shove protection still applies)", "f": 0}, {"id": "P2-38", "deck": "p2", "n": 38, "q": "Identify the wheel with the X under it. (Hopper car, hand brake on the right end; X under the inner wheel of the right-hand truck.)", "o": ["R2", "L2", "B2", "R3"], "a": 1, "r": "AAR convention: hand brake end = B end; stand at the B end; axles numbered from the B end. Not in the CPKC manuals.", "f": 1}, {"id": "P2-39", "deck": "p2", "n": 39, "q": "An employee encountering a main track switch in normal position, after having a warning on their clearance that the switch is in the reverse position, must:", "o": ["Communicate to other crew members or an employee that the switch is restored to normal, and provide a verbal switch restore report to the RTC", "Contact the RTC and inquire as to who restored the switch", "Reverse the switch after confirmation from the RTC", "Provide a switch restore report in writing to the RTC"], "a": 0, "r": "CROR 104, Notes (iii), p.39", "f": 0}, {"id": "P2-40", "deck": "p2", "n": 40, "q": "When must a switch restore report to normal be provided to the RTC?", "o": ["When physically at the switch, or having it in sight, or at the time when the switch is occupied by the movement", "The report may be initiated by either crew member, as long as the other employee acknowledges it as correct", "The report must be transmitted by the Conductor, and acknowledged as correct by the person controlling the locomotive", "The report must be transmitted only by the person controlling the movement, and acknowledged as correct by the same person"], "a": 0, "r": "CROR 104, Notes (iii), p.39", "f": 0}, {"id": "P2-41", "deck": "p2", "n": 41, "q": "When required to manually protect a crossing, who is responsible for ensuring that the crossing is properly protected?", "o": ["The Conductor", "The Locomotive Engineer", "All crew members", "Foreman Green"], "a": 2, "r": "CROR 106, p.43", "f": 0}, {"id": "P2-42", "deck": "p2", "n": 42, "q": "Your movement is approaching the limits of a GBO for engineering protection. Who must give you instructions to proceed within the limits stated?", "o": ["An ES employee designated by the foreman", "Only the foreman named in the GBO", "The foreman named in the GBO or the RTC", "The site supervisor"], "a": 1, "r": "CROR 42(b)(c), p.26", "f": 0}, {"id": "P2-43", "deck": "p2", "n": 43, "q": "TGBOs apply on ______?", "o": ["Main tracks", "Signalled tracks", "Other tracks when specified in special instructions", "All of the above"], "a": 3, "r": "CROR 157(a), p.59", "f": 0}, {"id": "P2-44", "deck": "p2", "n": 44, "q": "If a \"Hot Box\" alarm is identified on a \"Key Train\" while passing a wayside detector and the subsequent inspection fails to confirm evidence of a defect, how fast can your train proceed?", "o": ["20 MPH", "50 MPH", "10 MPH", "30 MPH"], "a": 3, "r": "GOI Section 8 item 11.4(c)(i), p.16", "f": 0}, {"id": "P2-45", "deck": "p2", "n": 45, "q": "You encounter a red flag to the right of the track upon which your train is operating. You are not in possession of a GBO requiring such signal. You must:", "o": ["Stop, communicate with the foreman as quickly as possible, and be governed by instructions received", "Proceed at reduced speed for 2 miles and, if no maintenance of way activities are observed, resume track speed", "Proceed and, at the first opportunity, advise the ES personnel of the improperly placed flag", "Stop. Report such to the RTC as quickly as possible, and be governed by instructions received"], "a": 3, "r": "CROR 44(b)(iii), p.28", "f": 0}, {"id": "P2-46", "deck": "p2", "n": 46, "q": "You have advised the ATM that you must leave equipment foul of a connecting track. What else must be done to protect the employees and equipment?", "o": ["The engine must be left coupled to the equipment", "The switch must be left lined for the track on which the equipment is left standing", "You cannot leave equipment foul of the connecting track", "An employee must be left with the equipment to warn other yard movements"], "a": 2, "r": "CROR 114(c), p.49 (CPKC change: equipment may only be left occupying the switch points)", "f": 0}, {"id": "P2-47", "deck": "p2", "n": 47, "q": "You are operating on a movement without a manned caboose. Select which EOT failures would prevent you from departing a scheduled crew change location.", "o": ["Fails COMM TEST", "Emergency feature is not working", "Weak batteries", "Fails to display rear air pressure", "All of the above"], "a": 4, "r": "GOI Section 6 items 18.1 and 18.3, p.12–13", "f": 0}, {"id": "P2-48", "deck": "p2", "n": 48, "q": "What must you do if your train encounters a red fusee burning on or near the track, or beyond the nearest rail of an adjacent track?", "o": ["Stop and proceed at restricted speed to the next signal", "Slow to Restricted speed to a point 2 miles beyond the location of the fusee", "Immediately reduce speed to operate prepared to stop within one-half the range of vision of equipment for two miles beyond the location of the fusee", "Stop, contact RTC and be governed by their instructions"], "a": 2, "r": "CROR 11(a) (REDUCED speed for 2 miles), p.20", "f": 0}, {"id": "P2-49", "deck": "p2", "n": 49, "q": "Your engine is shoving cars and approaching a public crossing at grade not equipped with automatic warning devices. Before fouling the crossing, a crew member must:", "o": ["Be on the leading car or on the ground in a position to warn persons who may be about to cross", "Provide flag protection", "Provide manual protection of the crossing until fully occupied", "Ring the engine bell"], "a": 2, "r": "CROR 103(b)(i) and 103(g), p.35–36", "f": 0}, {"id": "P2-50", "deck": "p2", "n": 50, "q": "How must you initiate an emergency broadcast?", "o": ["Positive identification", "The word emergency repeated three times at the beginning of the transmission", "The car initials, class and UN number of any dangerous goods involved", "All of the above"], "a": 1, "r": "CROR 125(a), p.53", "f": 0}, {"id": "P2-51", "deck": "p2", "n": 51, "q": "You are lifting all the cars that have been stored in a siding. The siding is equipped with derails. Must the derails always be left in the derailing position and locked?", "o": ["Yes, unless they are special derails so designated in Special Instructions", "When there are no cars in the track the derail must be left in the derailing position but need not be locked", "Yes", "No"], "a": 0, "r": "CROR 104.5(c)(d)(e), p.42", "f": 0}, {"id": "P2-52", "deck": "p2", "n": 52, "q": "After you have verified that you have the correct DOB, you must initial all pages except the last page, which must be signed.", "o": ["FALSE", "TRUE"], "a": 1, "r": "CROR 156(c), p.58", "f": 0}, {"id": "P2-53", "deck": "p2", "n": 53, "q": "When the RTC initiates radio communication to a movement, positive identification is to be used. Only the Conductor must respond.", "o": ["True", "False"], "a": 1, "r": "CROR 121, p.52", "f": 0}, {"id": "P2-54", "deck": "p2", "n": 54, "q": "You are operating on a train which is EOT equipped. The IDU (input and display unit) indicates \"VALV FAIL\". You reduce speed to 25 MPH. How long do you stay at that speed?", "o": ["Until the \"Comm\" button is pressed on the IDU", "Until the display unit no longer indicates \"VALV FAIL\" or a \"V\"", "Until instructed by the RTC", "Until stopping and replacing or performing another emergency test of the EOT"], "a": 3, "r": "GOI Section 6 item 18.2, Note (25 MPH until the EOT is replaced or repaired), p.13", "f": 0}, {"id": "P2-55", "deck": "p2", "n": 55, "q": "The RTC contacts your movement, requesting that you advise when you are ready to copy a clearance. Before responding, you may:", "o": ["Write in Item 3 the limits you have requested to expedite the process", "Insert only your train designation and signature", "Ask other crew members if they would like a copy", "Not pre-print anything"], "a": 3, "r": "CROR 136(a) (\"copy as it is transmitted\"), p.56", "f": 1}, {"id": "P2-56", "deck": "p2", "n": 56, "q": "When moving at restricted speed a movement must be on the lookout for broken rails.", "o": ["True", "False"], "a": 0, "r": "CROR Definitions, RESTRICTED speed, p.11", "f": 0}, {"id": "P2-57", "deck": "p2", "n": 57, "q": "A movement in multi-track is stopping as a result of an emergency brake application. The adjacent main track may be obstructed. What must a crew member do immediately?", "o": ["Request relief from flag protection from the RTC", "Transmit an emergency radio broadcast on the standby channel", "Immediately provide flag protection on the adjacent main track as per Emergency Protection", "Perform a pull-by inspection"], "a": 1, "r": "CROR 102(a)(i), p.34", "f": 0}, {"id": "P2-58", "deck": "p2", "n": 58, "q": "A train moving at restricted speed must be prepared to stop short of a switch not properly lined.", "o": ["True", "False"], "a": 0, "r": "CROR Definitions, RESTRICTED speed, p.11", "f": 0}, {"id": "P2-59", "deck": "p2", "n": 59, "q": "You are copying a clearance from the RTC. You have repeated the clearance back and the RTC states the word \"complete\" and initials. Radio communication fails before you can acknowledge it. Can this clearance be used?", "o": ["Yes", "No"], "a": 0, "r": "CROR 139 (effective when \"complete\" and initials are given), p.56", "f": 1}, {"id": "P2-60", "deck": "p2", "n": 60, "q": "All crew members are in the operating cab of the lead locomotive. You are in possession of a GBO which reads \"do not exceed 30 mph between mile 10 and mile 20 Appleton sub.\" Is this a restriction that requires a radio broadcast?", "o": ["Yes, 1 to 3 miles from the limits stated in the GBO and it must be communicated on the standby channel", "No, you do not need to communicate slow orders", "Yes, because all crew members are on the lead locomotive the only requirement is to call it out in the cab", "You only need to communicate it if the Engineer is not taking appropriate action to comply with the speed restriction"], "a": 0, "r": "CROR 578, p.77; 315, p.64; ROW 028", "f": 0}, {"id": "P2-61", "deck": "p2", "n": 61, "q": "Your train is operating in DOB limits. Your DOB will expire shortly and you are unable to clear the limits or communicate with the RTC to have it extended. What must you do?", "o": ["Stop before it expires", "Stop and send out flagmen", "Communicate with and be governed by the instructions of the ATM", "There is no restriction. The DOB remains in effect for the entire tour of duty"], "a": 0, "r": "CROR 156(b), p.58", "f": 0}, {"id": "P2-62", "deck": "p2", "n": 62, "q": "Prior to leaving a location where you are restricted by an item 6 in OCS, \"Protect against a preceding train\", what must you obtain?", "o": ["A Track Release from the preceding movement. Instructions in writing from the RTC and the preceding movement", "A location report from the preceding movement, transfer or the RTC confirming it has left an identifiable location ahead in writing; or instructions from the preceding movement in writing to close up between two identifiable locations operating prepared to stop short of the preceding movement", "Confirmation that the preceding movement is on the move", "The intended operation of the movement and the protection to be provided"], "a": 1, "r": "CROR 303.1(b)(d), p.62; ROW 004", "f": 0}, {"id": "P2-63", "deck": "p2", "n": 63, "q": "You are operating on a train which is EOT equipped. The IDU indicates \"VALV FAIL\". What speed do you reduce to?", "o": ["25 MPH", "15 MPH", "30 MPH", "Reduced speed"], "a": 0, "r": "GOI Section 6 item 18.2, Note, p.13", "f": 0}, {"id": "P2-64", "deck": "p2", "n": 64, "q": "A train crew has an OCS clearance between A and Z and their TGBO contains limits between A and M. The Timetable indicates TGBO limits are from A to Z. May the crew enter or move on the main track beyond M?", "o": ["Yes", "No"], "a": 1, "r": "CROR 157(a), p.59", "f": 0}, {"id": "P2-65", "deck": "p2", "n": 65, "q": "When does the cancellation of a clearance take effect?", "o": ["When it has been correctly repeated and acknowledged by the Conductor and Locomotive Engineer", "When the complete time is given", "When it has been correctly repeated and acknowledged by the Conductor", "When it has been correctly repeated and acknowledged by the RTC"], "a": 0, "r": "CROR 302.3(b), p.62", "f": 0}, {"id": "P2-66", "deck": "p2", "n": 66, "q": "You are the Conductor in the cab of the controlling locomotive. What is required as soon as you positively identify a fixed signal?", "o": ["Broadcast on the standby channel the signal's indication", "Communicate the signal indication to other crew members in the cab", "No communication is required unless it is a control signal", "Contact the RTC"], "a": 1, "r": "CROR 34(b), p.24", "f": 0}, {"id": "P2-67", "deck": "p2", "n": 67, "q": "You have an item 6 \"Protect against preceding movement\". What is required prior to closing up?", "o": ["The preceding movement must be stopped between two identifiable locations and arrangements may be made to \"close up\" between these two locations", "The arrangements must be made in writing between the crews of both movements", "The following movement must be prepared to stop short of the preceding movement", "All of the above"], "a": 3, "r": "CROR 303.1(d), p.62; ROW 004", "f": 0}, {"id": "P2-68", "deck": "p2", "n": 68, "q": "When may a movement enter or move within the limits of a TOP in OCS?", "o": ["When instructions in writing have been obtained from the foreman named on the clearance", "When the instructions are repeated to, and acknowledged by, the foreman named", "When in possession of a work clearance you have authority to move in TOP limits without instructions or further information", "Both A and B"], "a": 3, "r": "CROR 311(b), p.63; 138, p.56", "f": 0}, {"id": "P2-69", "deck": "p2", "n": 69, "q": "What must the Conductor and Locomotive Engineer do when a clearance is fulfilled, cancelled or superseded?", "o": ["Immediately draw an \"X\" across the clearance", "Destroy all copies, perform job briefing", "Advise all crew members", "Both (a) and (c)"], "a": 3, "r": "CROR 132(e), p.55", "f": 0}, {"id": "P2-70", "deck": "p2", "n": 70, "q": "In OCS territory, a reverse movement may be made into the siding at Moose with a proceed clearance provided that the trailing end of the movement stops within 300 feet and:", "o": ["You are in possession of a work clearance", "The track has not been reported clear of to the RTC", "There is no way to make this move", "Written authority"], "a": 1, "r": "CROR 308.1, p.63", "f": 0}, {"id": "P2-71", "deck": "p2", "n": 71, "q": "Restricted speed must not exceed which of the following?", "o": ["Medium speed (30 mph)", "Limited speed (45 mph)", "Diverging speed (25 mph)", "Slow speed (15 mph)"], "a": 3, "r": "CROR Definitions, p.11", "f": 0}, {"id": "P2-72", "deck": "p2", "n": 72, "q": "Slow speed is a speed that will:", "o": ["Permit stopping within one-half the range of vision of a track unit", "Not exceed 15 mph", "Permit stopping within one-half the range of vision of a switch not properly lined", "Not exceed 30 mph"], "a": 1, "r": "CROR Definitions, p.11", "f": 0}, {"id": "P2-73", "deck": "p2", "n": 73, "q": "Restricted speed will permit stopping within ______ the range of vision of equipment?", "o": ["Twice", "One-half", "One", "One-quarter"], "a": 1, "r": "CROR Definitions, p.11", "f": 0}, {"id": "P2-74", "deck": "p2", "n": 74, "q": "As Conductor of a movement you are in possession of a GBO. There are no yellow and green flags present at the location specified in the GBO. What must your crew do?", "o": ["Proceed, as the Foreman removes the flags when the slow order is no longer in effect", "Proceed, not exceeding 10 mph until the movement leaves the limits in the GBO", "Reduce to 10 mph, contact the RTC and be governed by his instructions", "Be governed by the requirements of the GBO and report such to the RTC as quickly as possible that the flags are not in place"], "a": 3, "r": "CROR 44(d), p.28", "f": 0}, {"id": "P2-75", "deck": "p2", "n": 75, "q": "The RTC has called your movement and wants to cancel your clearance. In order to do this, what must your crew ensure?", "o": ["Clear of the limits of the clearance, protected inside cautionary limits or protected by a GBO", "Prior to cancelling, the Conductor and Locomotive Engineer must verbally confirm that the clearance is no longer required", "At its final destination", "Both A and B"], "a": 3, "r": "CROR 302.3(a), p.62", "f": 0}, {"id": "P2-76", "deck": "p2", "n": 76, "q": "You are required to reverse your entire movement into a non-main track at a hand operated switch in ABS territory and have stopped with your tail end within 300 feet. What other conditions must be met before reversing direction?", "o": ["RTC permission and observe the 5 minute waiting rule before reversing", "There are no other requirements", "Must not have released the track to be operated over, and a crew member must be in a position to see the section of track to be used is clear and will remain clear of equipment or a track unit", "Both (a) and (c)"], "a": 2, "r": "CROR 308.1, p.63", "f": 0}, {"id": "P2-77", "deck": "p2", "n": 77, "q": "Crew members within physical hearing range are required to remind one another of the restrictions contained in a GBO or clearance in sufficient time to ensure compliance. In addition:", "o": ["Either crew member may initiate the communication and the other must acknowledge", "The Conductor must initiate the communication and the person controlling the locomotive must acknowledge", "The Conductor need not initiate communication as long as the person controlling the locomotive has already communicated it", "The person controlling the locomotive must initiate the communication and the Conductor must acknowledge"], "a": 0, "r": "CROR 142(b), p.57; General Rule C, p.14", "f": 1}, {"id": "P2-78", "deck": "p2", "n": 78, "q": "What item on a clearance form will be completed if a proceed train is authorized to move through the working limits of a work train?", "o": ["Item 3", "Item 7", "Item 4", "Item 8"], "a": 1, "r": "Clearance form item 7 (\"Protect against... between... and\"); CROR 314(a), p.64", "f": 0}, {"id": "P2-79", "deck": "p2", "n": 79, "q": "You are traveling on the main track in OCS and are approaching the end of your operating authority. You are unable to stop before the end of your operating authority. In addition to stopping, what steps must you take to protect your movement?", "o": ["Protect by Emergency Protection (Flag Protection)", "Emergency broadcast", "Contact RTC", "Update your resume", "All of the above"], "a": 4, "r": "CROR 80(b) requires a, b and c (Rules 35, 125 and advising the RTC), p.32. \"Update your resume\" is the instructor's joke. — confirmed by the CPKC Knowledge Check (CBT)", "f": 0}, {"id": "P2-80", "deck": "p2", "n": 80, "q": "You are delayed in the block after entering on a clear signal in ABS. There are switches between you and the next signal. How may you proceed?", "o": ["Preparing to stop at the next signal", "A speed that will permit stopping within half the range of vision of equipment", "Restricted speed", "Obtain permission from the RTC"], "a": 1, "r": "CROR 515 (REDUCED speed), p.72", "f": 0}, {"id": "P2-81", "deck": "p2", "n": 81, "q": "Your movement was stopped by a hot box detector in ABS territory. You made a cut behind the overheated car and moved it to a set-off point. You are now returning to your equipment, which you left in another block. As you approach signal 123, you observe that it is displaying \"Stop.\" What is required to pass signal 123?", "o": ["Communicate with the RTC and receive permission to go past a stop signal", "No stop is required at signal 123; you may proceed prepared to stop within half the range of vision of equipment to your movement. Communication with the RTC is not required", "Communication with the RTC is not required. You may proceed to your equipment at restricted speed. You are not required to stop", "Communication with the RTC is not required. After stopping at signal 123, you may proceed without any further restrictions to your equipment"], "a": 1, "r": "CROR 509(a), Exception, p.71", "f": 0}, {"id": "P2-82", "deck": "p2", "n": 82, "q": "Your train is operating in CTC and has been authorized to pass a block signal indicating Stop. The next block is not known to be clear or occupied, therefore no boxes are completed under item 3 of the Signal Authority Form. After the leading piece of equipment has passed entirely through the controlled location, at what speed must your train operate to the next signal or Block End sign?", "o": ["Authorized track speed", "Restricted speed", "Prepared to stop within one-half the range of vision of equipment", "Slow speed"], "a": 1, "r": "CROR 564(d), p.73; ROW 001", "f": 0}, {"id": "P2-83", "deck": "p2", "n": 83, "q": "Your movement is authorized by a proceed clearance. You have stopped and now want to reverse to pick up the Conductor. What authority do you require to do this reverse move?", "o": ["Verbal permission from the RTC", "A work clearance", "There is no way to make this reverse move", "Signal indication"], "a": 1, "r": "CROR 80(a), p.32; 308 and 308.1 (only 300 ft without further authority), p.63", "f": 1}, {"id": "P2-84", "deck": "p2", "n": 84, "q": "What must the crew on a preceding movement do prior to transmitting a location report?", "o": ["The Conductor must confirm accuracy with other crew members. The person who provided the report must confirm correctness to the following movement", "The Conductor must confirm their train is clear of an identifiable location prior to transmitting the report and confirming the repeat", "The Engineer must confirm their train is clear of an identifiable location prior to transmitting the report and confirming the repeat", "Nothing is required"], "a": 0, "r": "CROR 85.1(b)(c), p.33", "f": 0}, {"id": "P2-85", "deck": "p2", "n": 85, "q": "Your movement has entered a block on a clear signal indication in CTC and is delayed (stopped) in the block. How will the train proceed?", "o": ["Restricted speed", "Prepared to stop", "No restrictions", "As per RTC instructions"], "a": 2, "r": "CROR 515 applies in ABS only (p.72); no equivalent rule in CTC (560–578) — confirmed by the CPKC Knowledge Check (CBT)", "f": 0}, {"id": "P2-86", "deck": "p2", "n": 86, "q": "You are moving at restricted speed under the indication of a restricting signal. You must move at restricted speed until:", "o": ["The leading end of your movement is by the next signal or block end sign", "You can see the next signal and it is more permissive than Restricting", "You can confirm no other equipment is present", "The tail end of your movement is completely past the next block signal or Block End sign"], "a": 0, "r": "CROR 401.1, p.66; ROW 066", "f": 0}, {"id": "P2-87", "deck": "p2", "n": 87, "q": "You are delayed in the block after entering on a clear signal in ABS. There are no switches between you and the next signal. How may you proceed?", "o": ["Preparing to stop at the next signal", "A speed that will permit stopping within half the range of vision of equipment", "Restricted speed", "Obtain permission from the RTC"], "a": 0, "r": "CROR 515(i), p.72", "f": 0}, {"id": "P2-88", "deck": "p2", "n": 88, "q": "A train, after having passed beyond the limits of a block, needs to back into that block in CTC. The train crew informs the RTC of the intended move. Which block signal indications can authorize such?", "o": ["Stop signal", "Stop and Proceed signal", "A Restricting signal with a plate displaying the letter \"R\"", "The indication of a controlled signal, or a non-controlled (intermediate) which is more favorable than restricting"], "a": 3, "r": "CROR 573(a), p.76", "f": 0}, {"id": "P2-89", "deck": "p2", "n": 89, "q": "Under Item 3 of a clearance, \"After ______ clear(s)\", indicate how you would ensure that the train or transfer specified has arrived.", "o": ["By seeing that the designated engine number and initials, EOT or tail end remote locomotive have arrived, seen by both the Conductor and Engineer. Prior to departing crew members must confirm the restriction is no longer applicable", "A location report has been received from the RTC or that movement, that it is clear of the location. Prior to departing crew members must confirm the restriction is no longer applicable", "Call the ATM", "Either A or B"], "a": 3, "r": "CROR 304, p.63; ROW 053", "f": 0}, {"id": "P2-90", "deck": "p2", "n": 90, "q": "What is required to enter a signalled siding in CTC?", "o": ["Signal indication", "Permission or written authority from the RTC", "Being in possession of a TGBO", "Either A or B"], "a": 3, "r": "CROR 105(a), p.42; 80(a), p.32", "f": 0}, {"id": "P2-91", "deck": "p2", "n": 91, "q": "You must obtain permission from the RTC before making a reverse move within a block in CTC.", "o": ["TRUE", "FALSE"], "a": 0, "r": "CROR 573(c), p.76", "f": 0}, {"id": "P2-92", "deck": "p2", "n": 92, "q": "When may you place a Dual Control Switch in the \"hand\" position?", "o": ["At any time", "After the 5 minute waiting period", "When permission by the RTC has been obtained", "When switching is required to be performed over the switch"], "a": 2, "r": "CROR 104.2(a), p.41", "f": 0}, {"id": "P2-93", "deck": "p2", "n": 93, "q": "May more than one movement be authorized to work within the same limits in CTC?", "o": ["Yes, when authorized to protect against", "Yes, but only when the switches are placed in hand position", "No", "Yes, when authorized by the Foreman"], "a": 0, "r": "CROR 577(b), p.76", "f": 0}, {"id": "P2-94", "deck": "p2", "n": 94, "q": "If any part of your movement passes a block signal indicating Stop without authority, what must you do?", "o": ["Protect as illustrated in emergency protection, and emergency broadcast", "Contact RTC", "Back the movement clear of the signal", "Both A and B"], "a": 3, "r": "CROR 80(b), p.32", "f": 0}, {"id": "P2-95", "deck": "p2", "n": 95, "q": "What is your authority to move in CTC?", "o": ["Clearance", "Signal indication", "Permission or Written authority from the RTC", "Either (b) or (c)"], "a": 3, "r": "CROR 80(a), p.32", "f": 0}, {"id": "P2-96", "deck": "p2", "n": 96, "q": "May the RTC provide your movement with a signal to enter a foreman's limits prior to your arrival at that signal in CTC?", "o": ["No. The limits of a TOP must be protected by a stop signal in CTC", "No, unless your movement has been authorized to work in the same limits", "Yes. However no entry into foreman's limits may be made until instructions from the foreman are received verbally", "Yes. However no entry into foreman's limits may be made until instructions from the foreman are received in writing"], "a": 3, "r": "CROR 567.2, p.74; 138 (\"must be in writing\"), p.56", "f": 0}, {"id": "P2-97", "deck": "p2", "n": 97, "q": "Before entering the limits of a work train in OCS, the Conductor and Locomotive Engineer of each movement or transfer must have a thorough understanding in writing of:", "o": ["The intended operation of each movement or transfer", "The protection to be provided", "Both (a) and (b)", "The intended operation of the work train and the protection to be provided"], "a": 2, "r": "CROR 314(b), p.64", "f": 0}, {"id": "P2-98", "deck": "p2", "n": 98, "q": "How will a movement or transfer proceed that enters a block between signals in CTC at a hand operated switch not equipped with an electric switch lock?", "o": ["At Restricted speed to the next signal", "At Restricted speed to the next signal, unless the track is seen to be clear to the next signal and the indication of such signal permits operation at other than restricted speed", "At slow speed to the next signal", "Track speed prepared to stop"], "a": 1, "r": "CROR 570(b), p.75", "f": 0}, {"id": "P2-99", "deck": "p2", "n": 99, "q": "When a movement is authorized to pass a stop signal in CTC with box \"a. Lined by hand\" completed on the Signal Authority Form, a crew member must place the dual control switch in the \"hand\" position and line it for the route to be used. When must the crew member restore the selector lever to the \"power\" position and lock it?", "o": ["Before occupying the switch points", "After the movement has occupied the switch points", "When the movement has cleared the switch points", "Any of the above"], "a": 1, "r": "CROR 104.2(b)(iii), p.41", "f": 0}, {"id": "P2-100", "deck": "p2", "n": 100, "q": "Prior to accepting instructions from a foreman to enter his limits, what must the foreman state to the crew?", "o": ["The limits of his TOP", "The status of the sub-foreman", "That the flags are placed at the locations stated", "The type of work to be performed"], "a": 1, "r": "CROR 138, p.56", "f": 0}, {"id": "P2-101", "deck": "p2", "n": 101, "q": "What does \"authority to work\" allow a movement or transfer to do?", "o": ["Authorizes a movement to pass a Stop Signal", "Authorizes a movement to move in either direction within the specified limits", "Authorizes a movement to enter the limits of a Foreman's TOP", "Authorizes a movement to proceed at restricted speed"], "a": 1, "r": "CROR 577(a), p.76", "f": 0}, {"id": "P2-102", "deck": "p2", "n": 102, "q": "After receiving an authority to work and verbal permission from the RTC, when may the crew consider the signal indications suspended while switching at a dual control switch?", "o": ["When the dual control switch is placed in the \"hand\" position", "With written permission only from the RTC", "After copying an authority to pass a stop signal", "Both A and B"], "a": 0, "r": "CROR 577.1(a), p.77; ROW 001", "f": 0}, {"id": "SG-1", "deck": "sg", "n": 1, "q": "Is a Restricted clearance sign something that crew members must communicate and understand?", "o": ["Yes", "No"], "a": 0, "r": "CROR General Rule C(i) (\"when entering a track with restricted clearance\"), p.14", "f": 0}, {"id": "SG-2", "deck": "sg", "n": 2, "q": "What 3 items on a TGBO must be verified by crew members?", "o": ["Date, TGBO number, and correct number of pages", "Train/assignment #, correct number of pages, limits are correct", "Train/assignment #, date, correct number of pages"], "a": 1, "r": "CROR 157(b), p.59", "f": 0}, {"id": "SG-3", "deck": "sg", "n": 3, "q": "Would any cars of Special Dangerous or Explosives make a train a Key Train?", "o": ["Yes", "No"], "a": 1, "r": "GOI Section 8 item 11.1 (Key Train definition), p.15", "f": 0}, {"id": "SG-4", "deck": "sg", "n": 4, "q": "A movement cannot exceed the speed requirement contained in the GBO while:", "o": ["The movement is in between the yellow signals", "The movement is at or between the green signals", "The locomotive is between the yellow signals"], "a": 1, "r": "CROR 43(a), p.27", "f": 0}, {"id": "SG-5", "deck": "sg", "n": 5, "q": "When must crew members communicate any fixed signal?", "o": ["As soon as we can positively identify them", "As soon as we pass them", "None of the above"], "a": 0, "r": "CROR 34(b), p.24", "f": 0}, {"id": "SG-6", "deck": "sg", "n": 6, "q": "Do we require 3-point protection to apply/release a handbrake from the end platform of a car?", "o": ["Yes", "No"], "a": 1, "r": "Instructor's key. Safety Rule Book T-27 applies when working on the ground, p.23", "f": 0}, {"id": "SG-7", "deck": "sg", "n": 7, "q": "When retainers are in high pressure positions, a movement cannot exceed?", "o": ["25 MPH", "15 MPH", "None of the above"], "a": 2, "r": "Instructor's key", "f": 0}, {"id": "SG-8", "deck": "sg", "n": 8, "q": "When providing manual protection of a crossing, is it acceptable to be on the leading car?", "o": ["Yes", "No, you must be on the ground", "Either (a) or (b)"], "a": 1, "r": "CROR 103(g)(i), p.36", "f": 0}, {"id": "SG-9", "deck": "sg", "n": 9, "q": "Before performing any train brake test, what is the minimum tail end pressure required when you have an EOT attached?", "o": ["75 psi", "60 psi", "None of the above"], "a": 0, "r": "GOI Section 3 item 6.2 step 4 (rear car within 15 psi of 90 psi), p.8", "f": 0}, {"id": "SG-10", "deck": "sg", "n": 10, "q": "When reporting a main track switch back to normal position, is it acceptable to give the switch back when your tail end has passed the switch?", "o": ["True", "False"], "a": 1, "r": "CROR 104, Notes (iii) (report from the switch location), p.39", "f": 0}, {"id": "SG-11", "deck": "sg", "n": 11, "q": "When providing a location report to the RTC, crew members must both confirm with each other an exact location that the entire movement is clear of.", "o": ["True", "False"], "a": 0, "r": "CROR 85.1(b), p.33", "f": 0}, {"id": "SG-12", "deck": "sg", "n": 12, "q": "Is it acceptable to apply/release a wheel style hand brake from the ground?", "o": ["No", "If the bottom of the wheel is at shoulder height or below", "Yes, at any time"], "a": 1, "r": "Safety Rule Book T-14 item 3, p.16", "f": 0}, {"id": "SG-13", "deck": "sg", "n": 13, "q": "When separating from your train/transfer and leaving a remote locomotive with the standing portion, both conductor and engineer must communicate that the remote(s) are conditioned correctly.", "o": ["True", "False"], "a": 0, "r": "Instructor's key (GOI Section 2, Distributed Power)", "f": 0}, {"id": "SG-14", "deck": "sg", "n": 14, "q": "What is a movement's authority to occupy the main track in cautionary limits?", "o": ["DOB", "TGBO", "Cautionary limits are the movement's authority"], "a": 2, "r": "CROR 80(a), p.32; 94(a), p.33", "f": 0}, {"id": "SG-15", "deck": "sg", "n": 15, "q": "Before a clearance is cancelled, what must a crew do and ensure they have confirmed before the clearance is cancelled?", "o": ["Job briefing", "Clear of the limits of the clearance, protected by a GBO (before you cancel clearance) or inside cautionary limits", "Both (a) and (b)"], "a": 2, "r": "CROR 302.3(a), p.62", "f": 0}, {"id": "SG-16", "deck": "sg", "n": 16, "q": "Crew members must communicate and understand which of the following?", "o": ["When handbrakes are applied/released, when shoving equipment", "Prior to entering a foreman's limits, the instructions received; when restrictions are no longer applicable", "Both (a) and (b)"], "a": 2, "r": "CROR General Rule C(i), p.14", "f": 0}, {"id": "SG-17", "deck": "sg", "n": 17, "q": "If a movement encounters a green or yellow signal (flag) without having a GBO on the slow order, they must?", "o": ["Reduce to 25 mph until advised by RTC to resume speed", "Reduce to 15 MPH until advised by the ATM to resume speed", "Reduce to 10 MPH and communicate to the RTC and be governed by their instructions"], "a": 2, "r": "CROR 44(e), p.28", "f": 0}, {"id": "SG-18", "deck": "sg", "n": 18, "q": "When doing a pre-departure test of TIBS, do you require 3-point protection to install the EOT?", "o": ["Yes", "No"], "a": 0, "r": "Safety Rule Book T-27, p.23", "f": 0}, {"id": "SG-19", "deck": "sg", "n": 19, "q": "When operating on a non-main track, a movement must operate prepared to stop within half the range of?", "o": ["Equipment", "Track unit", "Both (a) and (b)"], "a": 2, "r": "CROR 105 and 105(c), p.42", "f": 0}, {"id": "SG-20", "deck": "sg", "n": 20, "q": "What must be verified in item 1 on your clearance in OCS?", "o": ["Clearance number", "Locomotive number", "None of the above"], "a": 1, "r": "CROR 302(b) (engine number verified visually), p.61", "f": 0}, {"id": "SG-21", "deck": "sg", "n": 21, "q": "When must you approach an automatic interlocking that is equipped with a timing circuit prepared to stop?", "o": ["When the time occupied in special instructions (timetable) has been exceeded", "Always", "When instructed by the RTC that the signal can change"], "a": 0, "r": "Instructor's key", "f": 0}, {"id": "SG-22", "deck": "sg", "n": 22, "q": "What is required when a movement has made a stop with its trailing end inside a controlled location and needs to change direction on the main track?", "o": ["Authority to work (577)", "Verbal instructions from the ATM", "Authority to pass a stop signal (564)"], "a": 0, "r": "Confirmed by CTC Knowledge Check Q13 (CBT): Authority to work", "f": 0}, {"id": "SG-23", "deck": "sg", "n": 23, "q": "What is a movement's authority to occupy the main track in OCS?", "o": ["Clearance", "Signal indication", "Both (a) and (b)"], "a": 0, "r": "CROR 80(a), p.32", "f": 0}, {"id": "SG-24", "deck": "sg", "n": 24, "q": "What are the two items that we must use to inspect for an overheated bearing?", "o": ["Temp crayon and water bottle", "Back of hand and a switch key", "Back of hand and temp crayon"], "a": 2, "r": "Instructor's key (GOI Section 5 item 11.0)", "f": 0}, {"id": "SG-25", "deck": "sg", "n": 25, "q": "When operating on a medium signal, what is the maximum speed, unless posted elsewhere?", "o": ["30 MPH", "45 MPH", "25 MPH"], "a": 0, "r": "CROR Definitions, MEDIUM speed, p.11", "f": 0}, {"id": "SG-26", "deck": "sg", "n": 26, "q": "When going past a Clear to Stop signal, a movement must reduce its speed to?", "o": ["15 MPH", "25 MPH", "30 MPH"], "a": 2, "r": "ROW 066 (Clear to Stop: 30 MPH or less, prepared to stop at next signal)", "f": 0}, {"id": "SG-27", "deck": "sg", "n": 27, "q": "While travelling in OCS/ABS you have been delayed after entering on a clear signal, and there are no switches between you and the next signal. How will you proceed?", "o": ["Prepared to stop at next signal", "30 MPH", "The RTC will advise you on the speed"], "a": 0, "r": "CROR 515(i), p.72", "f": 0}, {"id": "SG-28", "deck": "sg", "n": 28, "q": "What is your authority to enter the main track in CTC?", "o": ["TGBO", "OCS clearance", "Signal, RTC permission or written authority"], "a": 2, "r": "CROR 80(a), p.32", "f": 0}, {"id": "SG-29", "deck": "sg", "n": 29, "q": "What is the definition of limited speed?", "o": ["Not exceeding 45 MPH", "30 MPH maximum", "Neither of the above"], "a": 0, "r": "CROR Definitions, LIMITED speed, p.11", "f": 0}, {"id": "SG-30", "deck": "sg", "n": 30, "q": "If a locomotive is attached and you must adjust the knuckle by hand, what is the minimum distance required to go in between equipment?", "o": ["15 feet", "25 feet", "50 feet"], "a": 2, "r": "Safety Rule Book T-6 item 3, p.12", "f": 0}, {"id": "SG-31", "deck": "sg", "n": 31, "q": "A No. 1A brake test is performed when lifting (adding) cars to your movement en route.", "o": ["True", "False"], "a": 0, "r": "GOI Section 3 item 8.1 (cars not previously tested), p.9", "f": 0}, {"id": "SG-32", "deck": "sg", "n": 32, "q": "How must a movement operate within cautionary limits?", "o": ["Prepared to stop within half the range of vision of equipment and track units", "Short of a switch not lined / red flag between rails", "Both (a) and (b)"], "a": 2, "r": "CROR 94(b), p.33", "f": 0}, {"id": "SG-33", "deck": "sg", "n": 33, "q": "Can you ride inside the end cage of equipment?", "o": ["Yes", "No"], "a": 1, "r": "Safety Rule Book T-24 item 7, p.21", "f": 0}, {"id": "SG-34", "deck": "sg", "n": 34, "q": "What does a work authority (577) in CTC allow you to do?", "o": ["Disregard stop signals", "Enter/re-enter or move in both directions inside the limits", "Both (a) and (b)"], "a": 1, "r": "CROR 577(a), p.76", "f": 0}, {"id": "SG-35", "deck": "sg", "n": 35, "q": "Can you apply a handbrake when equipment is being pulled or shoved by a locomotive?", "o": ["Yes", "No"], "a": 1, "r": "CROR 112(iii), p.44", "f": 0}, {"id": "SG-36", "deck": "sg", "n": 36, "q": "Which of the following examples could cause sticky brakes?", "o": ["Defective control valve", "Hand brake is released (off)", "Both (a) and (b)"], "a": 0, "r": "GOI Section 5 item 13.2(h), p.7", "f": 0}, {"id": "SG-37", "deck": "sg", "n": 37, "q": "While operating on non-main track, you must operate prepared to stop short of?", "o": ["Switch not lined, derail in derail position, end of track", "Red/blue signal (flag) between the rails", "Both (a) and (b)"], "a": 2, "r": "CROR 105, p.42", "f": 0}, {"id": "SG-38", "deck": "sg", "n": 38, "q": "Must crew members communicate cautionary limit / advance cautionary limit signs?", "o": ["True", "False"], "a": 0, "r": "CROR 34(b)(x)(xi), p.24", "f": 0}, {"id": "SG-39", "deck": "sg", "n": 39, "q": "If brake pipe pressure increases, will the train brakes?", "o": ["Apply", "Release"], "a": 1, "r": "Air brake principle", "f": 0}, {"id": "SG-40", "deck": "sg", "n": 40, "q": "Except while being turned, a switch must be secured with an approved device.", "o": ["True", "False"], "a": 0, "r": "CROR 104(b), p.38", "f": 0}, {"id": "SG-41", "deck": "sg", "n": 41, "q": "What is the maximum speed of a Key Train?", "o": ["30 MPH", "50 MPH", "None of the above"], "a": 1, "r": "GOI Section 8 item 11.3, p.16", "f": 0}, {"id": "SG-42", "deck": "sg", "n": 42, "q": "When stopped at an automatic interlocking and looking in the box marked switches, you notice the lights of the conflicting route are lit. When would you open (knife) the switch?", "o": ["After waiting 5 minutes", "Immediately", "None of the above"], "a": 1, "r": "Instructor's key", "f": 0}, {"id": "SG-43", "deck": "sg", "n": 43, "q": "You have just proceeded by an Advance Clear to Stop signal. When do you need to be prepared to stop?", "o": ["At the next signal", "At the second signal", "Both the above"], "a": 1, "r": "Instructor's key (Advance Clear to Stop: prepared to stop at second signal)", "f": 0}, {"id": "SG-44", "deck": "sg", "n": 44, "q": "Must you communicate to your engineer/RCLS operator once you have safely entrained/detrained moving equipment?", "o": ["Yes", "Only if they request that you do", "No"], "a": 0, "r": "Safety Rule Book T-11 item 3, p.13", "f": 0}, {"id": "SG-45", "deck": "sg", "n": 45, "q": "Is it permissible to cross from one car to another?", "o": ["Yes, if cars are coupled and stationary, you maintain 3 points of contact", "Yes, both cars have appropriate end platform and grab irons", "Both (a) and (b)"], "a": 2, "r": "Safety Rule Book T-8 item 2, p.13", "f": 0}, {"id": "SG-46", "deck": "sg", "n": 46, "q": "If the signalman is off duty at a locally controlled interlocking, how do you know who is in charge?", "o": ["The ATM", "The RTC", "Special instructions (timetable)"], "a": 2, "r": "Instructor's key", "f": 0}, {"id": "SG-47", "deck": "sg", "n": 47, "q": "In CTC you need to change direction to re-enter a block you have cleared. What signals can allow you to do this?", "o": ["A controlled signal other than stop, or authority to pass a stop signal (564)", "A non-controlled signal other than restricting, or authority to work (577) to pass a restricting signal", "Either (a) or (b)"], "a": 2, "r": "CROR 573(a), p.76", "f": 0}, {"id": "SG-48", "deck": "sg", "n": 48, "q": "What conditions must be met to change direction on a proceed clearance in OCS/ABS?", "o": ["No greater than 300 feet and not have released the track behind you", "Crew member in position and cannot re-enter a block", "Both (a) and (b)"], "a": 2, "r": "CROR 308.1, p.63", "f": 0}, {"id": "SG-49", "deck": "sg", "n": 49, "q": "When would retaining valves be needed?", "o": ["When the RTC tells you", "When air pressure is good", "When the engineer deems necessary or by special instructions"], "a": 2, "r": "Instructor's key", "f": 0}, {"id": "SG-50", "deck": "sg", "n": 50, "q": "In all situations, before uncoupling, enough (sufficient) handbrakes must be applied.", "o": ["True", "False"], "a": 0, "r": "CROR 113.1(b), p.47; GOI Section 4 item 6.1 (System Revision Doc p.24)", "f": 0}, {"id": "SG-51", "deck": "sg", "n": 51, "q": "When there is a crew change, what type of train brake test is performed?", "o": ["No. 1", "EOT test", "Continuity test"], "a": 2, "r": "GOI Section 3 item 10.1, p.10", "f": 0}, {"id": "SG-52", "deck": "sg", "n": 52, "q": "All angle cocks and retainer valves must be in proper position to do any type of train brake test.", "o": ["True", "False"], "a": 0, "r": "GOI Section 3 item 6.2 step 1, p.8", "f": 0}, {"id": "SG-53", "deck": "sg", "n": 53, "q": "At a locally controlled interlocking, if authorized to pass a stop signal, must it be in writing?", "o": ["True", "False"], "a": 1, "r": "Instructor's key", "f": 0}, {"id": "OCS-1", "deck": "ocs", "n": 1, "q": "What authority is required to operate on the main track in OCS?", "o": ["Signal indication", "Foreman instruction", "A clearance", "RTC permission"], "a": 2, "r": "CROR 80(a), p.32; 302(a), p.61 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-2", "deck": "ocs", "n": 2, "q": "When receiving or copying a clearance, what must you verify under Item 1?", "o": ["The clearance number", "The engine number", "The limits of the clearance", "The date"], "a": 1, "r": "CROR 302(b), p.61 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-3", "deck": "ocs", "n": 3, "q": "How are the limits of a clearance defined in OCS?", "o": ["By Station Name Signs", "By Siding Switches", "By Mile Posts", "Any of the above."], "a": 3, "r": "CROR 82, p.32 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-4", "deck": "ocs", "n": 4, "q": "Under Item 3 of a clearance in OCS, after ______ clears, indicate how your crew would ensure that the movement specified has cleared that location.", "o": ["By seeing that the designated engine number and initials, EOT or tail end remote locomotive has been seen by both Conductor and Engineer, and prior to departing all crew members must confirm that the restriction is no longer applicable.", "A location report has been received from the RTC or the movement that it is clear of that location, and prior to departing all crew members must confirm that the restriction is no longer applicable.", "Contact the ATM", "Either (a) or (b)"], "a": 3, "r": "CROR 304, p.63; ROW 053 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-5", "deck": "ocs", "n": 5, "q": "Your movement is instructed to wait for the arrival of a transfer movement that is now clearing the switch at your location in OCS. The tail end of the transfer movement has no EOT or tail end remote locomotive. How will your crew verify that the transfer has arrived?", "o": ["By making direct communication with a member of the crew of the transfer or RTC.", "By observing the trailing end clears your location.", "Observe the trailing end clear your location and then proceed at reduced speed for 2 miles.", "Observe the trailing end clear your location; proceed at restricted speed for 2 miles."], "a": 0, "r": "CROR 304, p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-6", "deck": "ocs", "n": 6, "q": "The RTC has called your train and wants to cancel your clearance. In order to do this your entire movement must be:", "o": ["Clear of the limits of the clearance.", "Protected by a GBO.", "Within cautionary limits.", "Any of the above."], "a": 3, "r": "CROR 302.3(a), p.62 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-7", "deck": "ocs", "n": 7, "q": "When does the cancellation of a clearance take effect?", "o": ["When it has been correctly repeated and acknowledged by the conductor and locomotive engineer.", "When the complete time is given from the RTC.", "When it has been correctly repeated and acknowledged by just the conductor.", "When it has been correctly repeated and acknowledged by the RTC."], "a": 0, "r": "CROR 302.3(b), p.62 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-8", "deck": "ocs", "n": 8, "q": "What must the Conductor and Locomotive Engineer do when a clearance is fulfilled, cancelled or superseded?", "o": ["Immediately draw an \"X\" across the clearance.", "Destroy all copies, perform job briefing.", "Advise other crew members", "Both (a) and (c)."], "a": 3, "r": "CROR 132(e), p.55 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-9", "deck": "ocs", "n": 9, "q": "You are in OCS dark territory and authorized with a proceed clearance. You have been instructed to make a reverse movement into NMT to pick up some cars at this location. A reverse movement may be made into the NMT provided that:", "o": ["You are in possession of a work clearance", "The trailing end of the movement stops within 300 feet of the switch.", "The track has not been reported clear of to the RTC, movement or Foreman.", "Both (b) and (c)."], "a": 3, "r": "CROR 308.1, p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-10", "deck": "ocs", "n": 10, "q": "You have contacted the RTC to cancel a clearance. What information must be repeated back to the RTC?", "o": ["Clearance number, designation and the date.", "Clearance number, designation and the limits.", "Clearance number, limits and the date.", "Clearance number and the date."], "a": 1, "r": "CROR 302.3(a), p.62 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-11", "deck": "ocs", "n": 11, "q": "What information must be provided on a clearance form authorizing a movement to protect against another movement that is authorized to work or a foreman with a TOP in OCS?", "o": ["The engine number or name of the Foreman.", "The locations between which protection is provided.", "The intended operation of the Foreman or movement and the protection to be provided.", "Both (a) and (b)."], "a": 3, "r": "CROR 311(a), p.63; 314(a), p.64 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-12", "deck": "ocs", "n": 12, "q": "Before entering the limits of a movement that is authorized to work in OCS, the conductor and locomotive engineer of each movement must have a thorough understanding in writing of:", "o": ["The intended operation of each movement.", "The protection to be provided.", "Both (a) and (b).", "None of the above."], "a": 2, "r": "CROR 314(b), p.64 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-13", "deck": "ocs", "n": 13, "q": "A crew is cancelling a clearance. What information must be verified by a crew member through the use of underscoring?", "o": ["There is no need to underscore as long as the information is verified and communicated correct among crew members.", "Clearance number, RTC's initials and acknowledgement of Conductor and Engineer.", "Clearance number and the limits indicated in the authority.", "Clearance number, designation and the limits indicated in the authority."], "a": 3, "r": "CROR 302.3(a), p.62 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-14", "deck": "ocs", "n": 14, "q": "What information must be provided on a clearance form authorizing a movement to protect against a foreman?", "o": ["The name of the foreman.", "The locations between which protection is provided.", "The name of the Sub Foreman.", "Both (a) and (b)."], "a": 3, "r": "CROR 311(a), p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-15", "deck": "ocs", "n": 15, "q": "When may a movement proceed through or work within the foreman's limits provided on a clearance form or GBO?", "o": ["When instructions have been received in writing from, repeated to, and acknowledged by the foreman named.", "When crew members have communicated to each other the instructions.", "Must be in possession of a work clearance.", "Both (a) and (b)"], "a": 3, "r": "CROR 311(b), p.63; 138, p.56; 314(b), p.64 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-16", "deck": "ocs", "n": 16, "q": "Prior to accepting instructions to enter the foreman's limits, what must the foreman state to the train crew?", "o": ["The limits of his TOP.", "The status of the sub-foreman.", "That the flags are placed at the locations stated.", "The type of work to be performed."], "a": 1, "r": "CROR 138, p.56 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-17", "deck": "ocs", "n": 17, "q": "In OCS territory, a reverse movement may be made into a siding with a proceed clearance provided that the trailing end of the movement stops within 300 feet of the switch and:", "o": ["You are in possession of a work clearance.", "Written authority.", "The track has not been reported clear of to the RTC.", "There is no way to make this move."], "a": 2, "r": "CROR 308.1, p.63 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-18", "deck": "ocs", "n": 18, "q": "Prior to leaving the location where you have an item 6 protect against a preceding movement in OCS, what must you obtain?", "o": ["Instructions in writing from the RTC and the preceding movement.", "A location report from the preceding movement or RTC confirming it has left an identifiable location ahead in writing, or operating prepared to stop within one half the range of vision of equipment not exceeding 25 mph, or instructions to close up between two identifiable locations have been received from the preceding train in writing.", "Confirmation that the preceding movement is on the move.", "The intended operation of the movement and the protection to be provided."], "a": 1, "r": "CROR 303.1(b), p.62; ROW 004 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-19", "deck": "ocs", "n": 19, "q": "You have an item 6 to protect against a preceding movement in OCS. What are the requirements prior to closing up?", "o": ["The arrangements must be made in writing between crews of both movements.", "The following movement must not exceed slow speed within the close-up limits.", "Must be prepared to stop short of the preceding movement.", "Both (a) and (c)."], "a": 3, "r": "CROR 303.1(d), p.62 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-20", "deck": "ocs", "n": 20, "q": "What is required when providing the RTC with a location report?", "o": ["The employee must confirm with other crew members the entire movement has cleared an identifiable location.", "The report will be verbal.", "The employee providing the report must confirm correctness of the report to the RTC.", "All of the above."], "a": 3, "r": "CROR 85.1, p.33 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "OCS-21", "deck": "ocs", "n": 21, "q": "Your movement is operating on a proceed clearance and passes the limits of your authority. Other than stop, what are you required to do?", "o": ["Emergency broadcast.", "Emergency flag protection", "Emergency call to the RTC.", "All of the above."], "a": 3, "r": "CROR 80(b), p.32 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-1", "deck": "ctc", "n": 1, "q": "You need to enter the main track in CTC. How may the RTC authorize your movement to enter the main track?", "o": ["Issuing you a TGBO.", "Track release report, Proceed clearance.", "Signal indication, permission or written authority from the RTC.", "GBO, DOB."], "a": 2, "r": "CROR 80(a), p.32 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-2", "deck": "ctc", "n": 2, "q": "When operating in CTC, you have been asked to lift a car from a back track. What is one way to make a reverse movement within a block, without having to get a work authority?", "o": ["There is no way to make this move without a work authority", "Verbal permission from the RTC", "You may reverse no more than 300 ft. as long as an employee is in a position to see the track is clear and will remain clear.", "You do not need any kind of verbal or written authority to make this move because the track is yours"], "a": 2, "r": "CROR 573(c)(i), p.76 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-3", "deck": "ctc", "n": 3, "q": "If an authority to work is to be cancelled in CTC while the movement is within the affected limits, what information must be provided to the RTC?", "o": ["The intended direction of operation.", "The time required to clear the controlled block.", "Track limits.", "Distance to travel."], "a": 0, "r": "CROR 577(e), p.77; ROW 005 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-4", "deck": "ctc", "n": 4, "q": "A movement is authorized to work within the limits of another movement under the provisions of work authority in CTC. What must the conductor and locomotive engineer of each movement have with respect to the movements of each train and protection to be provided?", "o": ["A thorough verbal understanding.", "Form T GBO for each other.", "A copy of each others' work list.", "A thorough understanding in writing of the intended operation and the protection to be provided."], "a": 3, "r": "CROR 577(d), p.76 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-5", "deck": "ctc", "n": 5, "q": "Your movement has entered a block between signals in CTC using a hand operated switch which is not equipped with an electric switch lock. Unless other conditions exist, how must you approach the next signal?", "o": ["At Limited speed.", "At Restricted speed unless or until the track is seen to be clear to the next signal and the indication of such signal permits operation at other than restricted speed.", "At Slow speed.", "At Diverging speed."], "a": 1, "r": "CROR 570(b), p.75 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-6", "deck": "ctc", "n": 6, "q": "Your movement has entered a block on a clear signal indication in CTC and is delayed in the block. How will the movement proceed?", "o": ["At restricted speed", "Prepared to stop at the next signal.", "Authorized track speed.", "As per RTC instructions."], "a": 2, "r": "CROR 515 applies in ABS only, p.72 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-7", "deck": "ctc", "n": 7, "q": "Your movement is in possession of an authority to work. Your movement approaches a Stop signal in CTC. What must the movement do?", "o": ["Disregard the signal, you have a work authority.", "Stop before passing the signal. Obtain authority from RTC.", "Stop at the signal. Proceed at Restricted speed.", "Stop at the signal. Proceed at track speed."], "a": 1, "r": "CROR 564(a), p.73 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-8", "deck": "ctc", "n": 8, "q": "When the RTC authorizes your movement to pass more than one signal under the provisions of passing a stop signal in CTC, what must you do at each signal, if anything?", "o": ["Stop. Identify the signal by number prior to passing it.", "No need to stop, but must report clear of the signal to the RTC after passing.", "Employees must positively identify the signal by number prior to passing it.", "Stop. Call RTC and confirm the signal number."], "a": 2, "r": "CROR 564(d), p.73 · CPKC Knowledge Check (CBT) answer key", "f": 0}, {"id": "CTC-9", "deck": "ctc", "n": 9, "q": "When may a dual control switch be placed in \"hand\" position?", "o": ["When you need it to switch.", "I
